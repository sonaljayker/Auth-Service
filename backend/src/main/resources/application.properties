spring.application.name=Auth-Service-App

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_service}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:grespost}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true


springdoc.title=Auth-Service
springdoc.version=1.0.2602
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.path=/api
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

logging.level.org.springframework.security=Debug

security.jwt.secret=${JWT_SECRET:hdkdskomfmkdkoks0dmnkjsako2ennij48mdkdkdmdmsnk-secure-512-bit-secret-key-for-auth-service}
security.jwt.issuer=${JWT_ISSUER:api-auth-Service}
security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:3600}
security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:86400}
security.jwt.refresh-token-cookie-name=${JWT_REFRESH_COOKIE_NAME:refreshToken}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:lax}
security.jwt.cookie-http-only=${JWT_COOKIE_HTTP_ONLY:true}

# Gmail SMTP Configuration for Notifications (OTP & Password Reset)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Set to false to disable network email sending and use console simulation mode
app.mail.enabled=${MAIL_ENABLED:true}