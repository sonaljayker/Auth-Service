spring.application.name=Auth-Service-App-Test

spring.datasource.url=jdbc:h2:mem:auth_service_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

security.jwt.secret=test-secret-key-1234567890-test-secret-key-1234567890-very-long
security.jwt.issuer=auth-service-test
security.jwt.access-ttl-seconds=900
security.jwt.refresh-ttl-seconds=604800
security.jwt.refresh-token-cookie-name=refreshToken
security.jwt.cookie-secure=false
security.jwt.cookie-same-site=lax
security.jwt.cookie-http-only=true
