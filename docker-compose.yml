version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: auth-service-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Base app service (Spring Boot backend)
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auth-service-app
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-change-me-please-this-is-very-long-secret-key-1234567890-512-bit-secret}
      SECURITY_JWT_ACCESS_TTL_SECONDS: ${SECURITY_JWT_ACCESS_TTL_SECONDS:-900}
      SECURITY_JWT_REFRESH_TTL_SECONDS: ${SECURITY_JWT_REFRESH_TTL_SECONDS:-604800}
      SECURITY_JWT_ISSUER: ${SECURITY_JWT_ISSUER:-auth-service}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SERVER_PORT: 8090
    networks:
      - auth-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/v1/auth/register"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend web app service (React + Mantine UI)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auth-service-frontend
    networks:
      - auth-network
    restart: unless-stopped

  # NGINX reverse proxy: /app for frontend and /api for backend swagger & APIs
  nginx:
    image: nginx:alpine
    container_name: auth-service-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
      - frontend
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Development variant (start with `docker compose --profile dev up`)
  app_dev:
    profiles:
      - dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auth-service-app-dev
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: dev
      SECURITY_JWT_SECRET: change-me-dev-very-long-and-secure-secret-key-for-512-bit-hs512-algorithm
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auth-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/v1/auth/register"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Production variant (start with `docker compose --profile prod up`)
  app_prod:
    profiles:
      - prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auth-service-app-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SECURITY_JWT_SECRET: ${PROD_JWT_SECRET}
    restart: always
    depends_on:
      - postgres
    networks:
      - auth-network

volumes:
  postgres_data:
    driver: local

networks:
  auth-network:
    driver: bridge
