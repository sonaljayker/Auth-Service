version: '3.8'

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8090
      - SECURITY_JWT_SECRET=change-me-dev-very-long-and-secure-secret-key-for-512-bit-hs512-algorithm
    ports:
      - "8090:8090"
    depends_on:
      - postgres

  frontend:
    ports:
      - "3000:80"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
