version: '3.8'

services:
  app:
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - SERVER_PORT=8080
      - SECURITY_JWT_SECRET=${UAT_JWT_SECRET:-change-me-uat-very-long-and-secure-secret-key-for-512-bit-hs512-algorithm}
    ports:
      - "8080:8080"

  postgres:
    ports:
      - "5432:5432"
